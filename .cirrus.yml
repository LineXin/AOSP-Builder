env:
  # Основные переменные сборки
  DEVICE: "merlinx"
  ROM_URL: "https://github.com/LineageOS/android.git"
  ROM_BRANCH: "lineage-22.0"
  TARGET: "lineage_merlinx-userdebug"
  
  # Ссылка на твой кастомный локальный манифест (где лежат адаптированные под А15 деревья)
  LOCAL_MANIFEST_URL: "https://raw.githubusercontent.com/LineXin/локальный_репозиторий/main/manifest.xml"

  # Настройки компилятора
  USE_CCACHE: 1
  CCACHE_SIZE: "50G"
  CCACHE_DIR: "/tmp/ccache"

task:
  name: "LineageOS 22 Compiler for Merlinx"
  timeout_in: 120m # Максимальный лимит Cirrus CI
  
  # Используем жирный инстанс. Cirrus дает отличные ресурсы для Compute Engine контейнеров
  container:
    image: ghcr.io/sushrut1101/docker:latest # Проверенный готовый Docker-образ со всеми зависимостями АOSP
    cpu: 8
    memory: 32G

  # Встроенный кэш Cirrus CI. Позволит сохранять скомпилированные куски между перезапусками
  ccache_cache:
    folder: "/tmp/ccache"
    fingerprint_script: echo "ccache_merlinx_v1"
    populate_script: mkdir -p /tmp/ccache

  # Шаг 1: Подготовка окружения и проверка диска
  environment_setup_script:
    - df -h
    - git config --global user.name "LineXin-Builder"
    - git config --global user.email "linexin.developer@gmail.com"
    - mkdir -p ~/android/lineage
    - ccache -M $CCACHE_SIZE
    - ccache -s

  # Шаг 2: Синхронизация исходников (Repo Sync)
  repo_sync_script:
    - cd ~/android/lineage
    - repo init --depth=1 -u $ROM_URL -b $ROM_BRANCH
    # Подтягиваем твои адаптированные деревья merlinx через локальный манифест
    - mkdir -p .repo/local_manifests
    - curl -o .repo/local_manifests/merlinx.xml $LOCAL_MANIFEST_URL
    # Оптимизированная быстрая синхронизация
    - repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
    - df -h

  # Шаг 3: Компиляция прошивки
  compile_script:
    - cd ~/android/lineage
    - source build/envsetup.sh
    - breakfast $DEVICE userdebug
    # Запуск таймера, чтобы сборка корректно завершилась до падения по таймауту
    - mka lineage -j$(nproc --all)

  # Шаг 4: Выгрузка собранного zip-архива (или логов в случае неудачи)
  upload_artifacts_script:
    - cd ~/android/lineage/out/target/product/merlinx/
    - |
      if [ -f lineage-22.0-*.zip ]; then
        echo "Сборка успешна! Выгружаем архив..."
        # Сюда можно вписать команду отправки в Telegram или на файлообменник (например, через curl или rclone)
      else
        echo "Билд не успел завершиться или упал с ошибкой. Логи компиляции:"
        tail -n 100 ~/android/lineage/out/error.log || true
      fi
    - ccache -s # Показывает статистику кэша перед сохранением
